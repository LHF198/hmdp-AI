<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"
    />
    <title>黑马点评 - 消息中心</title>
    <!-- 引入样式 -->
    <link rel="stylesheet" href="./css/element.css" />
    <link href="./css/main.css" rel="stylesheet" />
    <link href="./css/info.css" rel="stylesheet" />
    <link href="./css/glass.css" rel="stylesheet" />

    <style type="text/css">
      .msg-list {
        padding: 10px 14px;
      }
      .msg-item {
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(255, 255, 255, 0.85);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        cursor: pointer;
      }
      .msg-item img {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        flex-shrink: 0;
        background: #eee;
      }
      .msg-body {
        flex: 1;
        min-width: 0;
      }
      .msg-body .msg-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .msg-nick {
        font-size: 15px;
        font-weight: 600;
        color: #1a1a1a;
      }
      .msg-time {
        font-size: 12px;
        color: #999;
        flex-shrink: 0;
        margin-left: 8px;
      }
      .msg-content {
        font-size: 13px;
        color: #555;
        margin-top: 4px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .msg-ref {
        font-size: 12px;
        color: #999;
        margin-top: 4px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .msg-empty {
        text-align: center;
        color: #999;
        font-size: 14px;
        padding: 60px 0;
      }
      .msg-empty i {
        font-size: 48px;
        color: #ddd;
        display: block;
        margin-bottom: 12px;
      }
      .el-tabs__header {
        margin: 0;
        background: rgba(255, 255, 255, 0.85);
      }
    </style>
  </head>

  <body>
    <div id="app">
      <div class="header">
        <div class="header-back-btn" @click="goBack">
          <i class="el-icon-arrow-left"></i>
        </div>
        <div class="header-title">消息中心&nbsp;&nbsp;&nbsp;</div>
      </div>

      <el-tabs v-model="activeName" @tab-click="handleClick">
        <el-tab-pane label="评论" name="comments">
          <div class="msg-list">
            <div
              v-for="c in comments"
              :key="c.id"
              class="msg-item"
              @click="toBlog(c.blog_id)"
            >
              <img :src="c.user_icon || '/imgs/icons/default-icon.png'" alt="" />
              <div class="msg-body">
                <div class="msg-top">
                  <span class="msg-nick">{{c.user_nick_name}}</span>
                  <span class="msg-time">{{formatTime(c.create_time)}}</span>
                </div>
                <div class="msg-content">评论了你：{{c.content}}</div>
                <div class="msg-ref">来自笔记《{{c.blog_title}}》</div>
              </div>
            </div>
            <div v-if="!loading && comments.length === 0" class="msg-empty">
              <i class="el-icon-chat-dot-round"></i>暂无评论消息
            </div>
          </div>
        </el-tab-pane>

        <el-tab-pane label="赞" name="likes">
          <div class="msg-empty">
            <i class="el-icon-thumb"></i>暂无点赞消息<br />
            <span style="font-size: 12px">点赞明细数据暂未开放</span>
          </div>
        </el-tab-pane>

        <el-tab-pane label="关注" name="follows">
          <div class="msg-list">
            <div
              v-for="f in follows"
              :key="f.id"
              class="msg-item"
              @click="toUser(f.user_id)"
            >
              <img :src="f.user_icon || '/imgs/icons/default-icon.png'" alt="" />
              <div class="msg-body">
                <div class="msg-top">
                  <span class="msg-nick">{{f.user_nick_name}}</span>
                  <span class="msg-time">{{formatTime(f.create_time)}}</span>
                </div>
                <div class="msg-content">关注了你</div>
              </div>
            </div>
            <div v-if="!loading && follows.length === 0" class="msg-empty">
              <i class="el-icon-user"></i>还没有人关注你
            </div>
          </div>
        </el-tab-pane>
      </el-tabs>

      <foot-bar :active-btn="3"></foot-bar>
    </div>
    <script src="./js/vue.js"></script>
    <script src="./js/axios.min.js"></script>
    <script src="./js/element.js"></script>
    <script src="./js/common.js"></script>
    <script src="./js/footer.js"></script>
    <script>
      const app = new Vue({
        el: "#app",
        data: {
          activeName: "comments",
          loading: false,
          comments: [],
          follows: [],
        },
        created() {
          this.queryComments();
          this.queryFollows();
        },
        methods: {
          queryComments() {
            this.loading = true;
            axios
              .get("/message/comments")
              .then(({ data }) => {
                this.comments = data || [];
              })
              .catch((err) => {
                this.$message.error(err);
              })
              .finally(() => {
                this.loading = false;
              });
          },
          queryFollows() {
            axios
              .get("/message/follows")
              .then(({ data }) => {
                this.follows = data || [];
              })
              .catch((err) => {
                this.$message.error(err);
              });
          },
          handleClick() {
            // 赞 tab 暂无明细数据，直接展示空态
          },
          toBlog(blogId) {
            if (blogId) {
              location.href = "/blog-detail.html?id=" + blogId;
            }
          },
          toUser(userId) {
            if (userId) {
              location.href = "/other-info.html?id=" + userId;
            }
          },
          formatTime(t) {
            if (!t) {
              return "";
            }
            // 兼容 "2022-01-05T12:00:00" 或数据库返回的 "2022-01-05 12:00:00"
            let s = String(t).replace("T", " ").split(".")[0];
            return s.substring(0, 16);
          },
          goBack() {
            history.back();
          },
        },
      });
    </script>
  </body>
</html>
