<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"
    />
    <title>黑马点评</title>
    <!-- 引入样式 -->
    <link rel="stylesheet" href="./css/element.css" />
    <link href="./css/main.css" rel="stylesheet" />
    <link href="./css/info.css" rel="stylesheet" />
    <link href="./css/glass.css" rel="stylesheet" />

    <style type="text/css"></style>
  </head>
  <body>
    <div id="app">
      <div class="header">
        <div class="header-back-btn" @click="goBack">
          <i class="el-icon-arrow-left"></i>
        </div>
        <div class="header-title">资料编辑&nbsp;&nbsp;&nbsp;</div>
      </div>
      <div class="edit-container">
        <div class="info-box">
          <div class="info-item">
            <div class="info-label">头像</div>
            <div class="info-btn" style="cursor: pointer" @click="chooseIcon" title="点击更换头像">
              <img
                width="35"
                style="border-radius: 50%"
                :src="user.icon || '/imgs/icons/default-icon.png'"
                alt=""
              />
              <div><i class="el-icon-arrow-right"></i></div>
            </div>
          </div>
          <div class="divider"></div>
          <div class="info-item">
            <div class="info-label">昵称</div>
            <div class="info-btn">
              <el-input
                size="mini"
                v-model="user.nickName"
                maxlength="20"
                style="width: 150px; text-align: right"
              ></el-input>
            </div>
          </div>
          <div class="divider"></div>
          <div class="info-item">
            <div class="info-label">个人介绍</div>
            <div class="info-btn">
              <el-input
                size="mini"
                v-model="info.introduce"
                maxlength="128"
                placeholder="介绍一下自己"
                style="width: 150px; text-align: right"
              ></el-input>
            </div>
          </div>
        </div>
        <div class="info-box">
          <div class="info-item">
            <div class="info-label">性别</div>
            <div class="info-btn">
              <el-select size="mini" v-model="info.gender" placeholder="选择">
                <el-option :value="false" label="男"></el-option>
                <el-option :value="true" label="女"></el-option>
              </el-select>
            </div>
          </div>
          <div class="divider"></div>
          <div class="info-item">
            <div class="info-label">城市</div>
            <div class="info-btn">
              <el-select
                size="mini"
                v-model="info.city"
                filterable
                allow-create
                default-first-option
                placeholder="选择"
              >
                <el-option
                  v-for="c in cities"
                  :key="c"
                  :value="c"
                  :label="c"
                ></el-option>
              </el-select>
            </div>
          </div>
          <div class="divider"></div>
          <div class="info-item">
            <div class="info-label">生日</div>
            <div class="info-btn">
              <el-date-picker
                size="mini"
                v-model="info.birthday"
                type="date"
                value-format="yyyy-MM-dd"
                placeholder="添加"
              ></el-date-picker>
            </div>
          </div>
        </div>
        <div class="info-box" style="text-align: center">
          <el-button
            type="primary"
            round
            style="width: 80%; background: #ff6633; border-color: #ff6633"
            @click="save"
            >保存修改</el-button
          >
        </div>

        <div class="info-box">
          <div class="info-item">
            <div class="info-label">我的积分</div>
            <div class="info-btn">
              <div>查看积分</div>
              <div><i class="el-icon-arrow-right"></i></div>
            </div>
          </div>
          <div class="divider"></div>
          <div class="info-item">
            <div class="info-label">会员等级</div>
            <div class="info-btn">
              <div><a href="javascript:void(0)">成为VIP尊享特权</a></div>
              <div><i class="el-icon-arrow-right"></i></div>
            </div>
          </div>
        </div>
      </div>
      <foot-bar :active-btn="4"></foot-bar>
    </div>
    <script src="./js/vue.js"></script>
    <script src="./js/axios.min.js"></script>
    <!-- 引入组件库 -->
    <script src="./js/element.js"></script>
    <script src="./js/common.js"></script>
    <script src="./js/footer.js"></script>
    <script>
      const app = new Vue({
        el: "#app",
        data: {
          user: "",
          info: {},
          iconChanged: false, // 是否更换了头像
          cities: [
            "杭州",
            "北京",
            "上海",
            "广州",
            "深圳",
            "成都",
            "南京",
            "武汉",
            "西安",
            "重庆",
          ],
        },
        created() {
          this.checkLogin();
        },
        methods: {
          checkLogin() {
            // 查询用户信息
            axios
              .get("/user/me")
              .then(({ data }) => {
                this.user = data;
                // 实时回显个人资料（不依赖 sessionStorage，保证直接进入本页也能显示）
                axios
                  .get("/user/info/" + this.user.id)
                  .then(({ data: info }) => {
                    if (info) {
                      this.info = info;
                    }
                  })
                  .catch(() => {});
              })
              .catch((err) => {
                this.$message.error(err);
                setTimeout(() => (location.href = "login.html"), 1000);
              });
          },
          chooseIcon() {
            // 动态创建文件选择框，上传头像
            let input = document.createElement("input");
            input.type = "file";
            input.accept = "image/*";
            input.onchange = () => {
              if (!input.files || !input.files[0]) {
                return;
              }
              let fd = new FormData();
              fd.append("file", input.files[0]);
              axios
                .post("/upload/blog", fd)
                .then(({ data }) => {
                  // data 是图片相对路径，直接展示新头像，保存时一并提交
                  this.user.icon = data;
                  this.iconChanged = true;
                })
                .catch((err) => this.$message.error(err));
            };
            input.click();
          },
          goBack() {
            history.back();
          },
          save() {
            if (!this.user.nickName || !this.user.nickName.trim()) {
              this.$message.error("昵称不能为空");
              return;
            }
            let data = {
              nickName: this.user.nickName,
              city: this.info.city || null,
              introduce: this.info.introduce || null,
              birthday: this.info.birthday || null,
            };
            // 更换了头像则一并提交
            if (this.iconChanged && this.user.icon) {
              data.icon = this.user.icon;
            }
            // gender：false=男，true=女；未选择时不传
            if (this.info.gender === true || this.info.gender === false) {
              data.gender = this.info.gender;
            }
            axios
              .put("/user/info", data)
              .then(() => {
                // 同步更新本地缓存（昵称、头像也写入 session，供其他页面立即生效）
                let saved = JSON.parse(JSON.stringify(this.info));
                if (this.iconChanged && this.user.icon) {
                  saved.icon = this.user.icon;
                }
                sessionStorage.setItem("userInfo", JSON.stringify(saved));
                this.$message.success("保存成功");
                setTimeout(() => (location.href = "info.html"), 800);
              })
              .catch(this.$message.error);
          },
        },
      });
    </script>
  </body>
</html>
