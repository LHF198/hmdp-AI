# ============ 公共配置（跨环境共享） ============
# 环境隔离：默认激活 dev（本地开箱即用），生产环境启动时显式指定
#   --spring.profiles.active=prod
# 环境变量注入要求（均通过 Windows 用户级环境变量注入，setx 后需重启终端/IDE）：
#   AI_API_KEY    AI 模型服务密钥（未设置时应用以降级模式启动，AI 问答接口返回配置提示）
server:
  port: 8081

spring:
  application:
    name: hmdp-backend
  profiles:
    default: dev
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  ai:
    # 指定使用 OpenAI 协议兼容的 ChatModel（starter 为 spring-ai-starter-model-openai）
    model:
      chat: openai
    openai:
      # ============ 模型服务配置 ============
      # 默认：阿里云百炼 DashScope（兼容 OpenAI 协议），对话 + 知识库嵌入一体
      # 注册地址：https://bailian.console.aliyun.com
      # 密钥通过环境变量 AI_API_KEY 注入（setx AI_API_KEY "sk-..."），禁止在配置文件中明文写入
      # 未设置时由 AiFallbackEnvironmentPostProcessor 禁用 OpenAI 自动配置（Spring AI 1.0 对空 key 强校验），
      # 应用降级启动，AI 问答接口返回"未配置"提示
      api-key: ${AI_API_KEY:}
      # 注意：Spring AI 会自动拼接 /v1 路径，因此 base-url 不能包含 /v1 后缀，否则会请求到 /v1/v1/xxx 导致 404
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen-flash
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-v4
      # ---------- 备选一：DeepSeek 对话 + DashScope 嵌入（聊天用 DeepSeek，知识库嵌入仍需 DashScope） ----------
      # api-key: ${AI_API_KEY:sk-xxxx}
      # base-url: ${AI_BASE_URL:https://api.deepseek.com}
      # chat:
      #   options:
      #     model: ${AI_CHAT_MODEL:deepseek-chat}
      # embedding:
      #   base-url: https://dashscope.aliyuncs.com/compatible-mode
      #   api-key: ${AI_EMBEDDING_API_KEY:sk-xxxx}
      #   options:
      #     model: ${AI_EMBEDDING_MODEL:text-embedding-v4}

mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包

app:
  # 图片上传目录：默认相对项目根（frontend/html/hmdp/imgs/），nginx 已通过
  # location /imgs/ alias 直连该目录（见 frontend/conf/nginx.conf），新上传图片立即可见；
  # 注意：相对路径按 JVM 工作目录解析（start_backend.ps1 / restart_backend.ps1 均以项目根启动），
  # 生产环境建议用环境变量 HMDP_UPLOAD_DIR 指定绝对路径，并同步修改 nginx alias
  upload-dir: ${HMDP_UPLOAD_DIR:frontend/html/hmdp/imgs/}
  demo:
    # 演示环境无短信通道：置 true 时验证码直接回显给前端（仅限开发 profile，生产禁止开启）
    echo-code: false
  ai:
    memory:
      type: redis        # 会话记忆实现：redis（默认，存 Redis，TTL 可配置）| memory（进程内存）
      ttl-days: 1         # Redis 记忆保留天数（<=0 时回退为 1 天）
    rate-limit:           # AI 接口限流（IP 维度 + Redis 固定窗口，Redis 异常时自动放行）
      enabled: true       # 总开关
      per-minute: 30      # 每 IP 每分钟最大请求数
    rag:
      # 向量快照存储介质：simple（本地 JSON 文件，默认）| redis（普通 Redis 字符串，生产推荐）
      # 检索始终在内存 SimpleVectorStore 完成（实测 3 条向量 0.14ms），快照仅作持久化：
      #   simple = 本地 JSON 文件（store-path）；redis = 普通 Redis 字符串（redis-key），
      #   无需 RediSearch/Redis Stack，多实例共享、重启不丢、不依赖工作目录
      store: simple
      store-path: data/ai-vector-store.json  # simple 模式快照文件：重启免重复向量化（省 embedding 配额、加快启动）
                                            # 支持绝对路径；生产 java -jar 启动建议配绝对路径以规避工作目录差异
      redis-key: ai:vector:snapshot         # redis 模式快照键
      rebuild: false      # 是否忽略快照强制重建（知识库文档更新后删除快照文件或改为 true 重建）
